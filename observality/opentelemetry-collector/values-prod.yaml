mode: deployment

replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.102.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

serviceAccount:
  create: true

service:
  type: ClusterIP

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP

  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

  metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# 🔥 IMPORTANT — Disable default internal 8888 telemetry
config:

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 800
      spike_limit_mib: 200
    batch:
      timeout: 5s
      send_batch_size: 1024

  exporters:

    # Traces → Tempo
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

    # Logs → Loki
    loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
      tls:
        insecure: true

    # Metrics → Prometheus
    prometheus:
      endpoint: "0.0.0.0:8889"

  service:

    # 🔥 CRITICAL FIX — disable internal telemetry 8888
    telemetry:
      metrics:
        readers: []

    extensions: [health_check]

    pipelines:

      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]

      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [loki]

      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]

