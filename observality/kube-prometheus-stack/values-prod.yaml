# Disable Grafana if you already have external one
grafana:
  enabled: true
  service:
    type: ClusterIP   # NEVER LoadBalancer in production without auth
  adminPassword: "StrongPassword123"

# Disable Alertmanager if not needed
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 200Mi
        cpu: 100m
      limits:
        memory: 500Mi
        cpu: 300m

prometheus:
  prometheusSpec:
    retention: 7d    # reduce retention to control storage
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 3Gi
        cpu: 1

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard   # change based on your cluster
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

# Reduce node exporter resource usage
prometheus-node-exporter:
  resources:
    requests:
      memory: 50Mi
      cpu: 50m
    limits:
      memory: 200Mi
      cpu: 100m

kube-state-metrics:
  resources:
    requests:
      memory: 100Mi
      cpu: 100m
    limits:
      memory: 300Mi
      cpu: 200m

# Security improvement
defaultRules:
  create: true

